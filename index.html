    <!-- Toast & Modal Styles -->
    <style>
      /* Responsive Base Styles - Fix viewport issues */
      * {
        box-sizing: border-box;
      }
      
      html {
        overflow-x: hidden;
        width: 100%;
      }
      
      body {
        overflow-x: hidden;
        width: 100%;
        position: relative;
      }
      
      #app {
        overflow-x: hidden;
        width: 100%;
        max-width: 100vw;
      }
      
      /* Ensure all containers respect viewport width */
      .container {
        max-width: 100%;
        overflow-x: hidden;
      }
      
      /* Toast Notifications */
      .custom-toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        min-width: 300px;
        max-width: 90%;
        padding: 16px 20px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 9999;
        animation: slideDown 0.3s ease-out;
        font-family: system-ui, -apple-system, sans-serif;
      }
      
      .custom-toast.success {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: white;
      }
      
      .custom-toast.error {
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        color: white;
      }
      
      .custom-toast.warning {
        background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        color: white;
      }
      
      .custom-toast.info {
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: white;
      }
      
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translate(-50%, -20px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }
      
      @keyframes fadeOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      
      .toast-icon {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
      }
      
      .toast-content {
        flex: 1;
        font-weight: 500;
      }
      
      .toast-close {
        cursor: pointer;
        opacity: 0.8;
        transition: opacity 0.2s;
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
      
      .toast-close:hover {
        opacity: 1;
      }

      /* Hide scrollbar but keep scrolling */
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }

      /* Safe area for iOS notch/home indicator */
      .safe-area-bottom {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      /* Mobile-first: Ensure inputs are at least 16px to prevent iOS zoom */
      @media (max-width: 767px) {
        input, select, textarea {
          font-size: 16px !important;
        }

        /* Compact card padding on mobile */
        .mobile-compact {
          padding: 12px !important;
        }
      }

      /* Modal Dialog */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        padding: 16px;
        animation: fadeIn 0.2s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .modal-container {
        background: white;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 500px;
        width: 100%;
        animation: slideUp 0.3s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .modal-header {
        padding: 24px 24px 16px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .modal-icon {
        width: 48px;
        height: 48px;
      }

      .modal-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #1f2937;
      }

      .modal-body {
        padding: 0 24px 24px 24px;
      }

      .modal-message {
        color: #6b7280;
        line-height: 1.6;
        font-size: 1rem;
      }

      .modal-footer {
        padding: 16px 24px 24px 24px;
        display: flex;
        gap: 12px;
        justify-content: flex-end;
      }

      .modal-btn {
        padding: 10px 24px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
        font-size: 1rem;
      }

      .modal-btn-cancel {
        background: #f3f4f6;
        color: #374151;
      }

      .modal-btn-cancel:hover {
        background: #e5e7eb;
      }

      .modal-btn-confirm {
        background: #4f46e5;
        color: white;
      }

      .modal-btn-confirm:hover {
        background: #4338ca;
      }

      .modal-btn-confirm:focus {
        outline: 2px solid #4f46e5;
        outline-offset: 2px;
      }

      /* Skeleton loader */
      @keyframes skeleton-shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position:  200% 0; }
      }
      .skeleton {
        background: linear-gradient(90deg, #e2e8f0 25%, #cbd5e1 50%, #e2e8f0 75%);
        background-size: 200% 100%;
        animation: skeleton-shimmer 1.4s ease-in-out infinite;
        border-radius: 4px;
      }

      /* Slotmaschine (Partner-Auslosung Doppel-K.O.) – eigenes Casino-Design */
      .slot-overlay {
        position: fixed; inset: 0; z-index: 9998;
        display: flex; align-items: center; justify-content: center;
        padding: 16px; background: rgba(8, 6, 20, 0.82);
        animation: fadeIn 0.2s ease-out;
      }
      .slot-machine {
        position: relative; width: 100%; max-width: 420px;
        padding: 22px 20px 20px; border-radius: 24px; text-align: center; color: #fff;
        background: radial-gradient(circle at 50% 0%, #7f1d1d 0%, #450a0a 55%, #1c0505 100%);
        border: 4px solid #f59e0b;
        box-shadow: 0 0 0 4px #78350f, 0 0 40px rgba(245, 158, 11, 0.55), inset 0 0 30px rgba(0, 0, 0, 0.6);
      }
      .slot-subtitle {
        font-size: 12px; font-weight: 700; letter-spacing: 0.12em;
        text-transform: uppercase; color: #fcd34d;
      }
      .slot-title {
        font-size: 20px; font-weight: 800; margin: 2px 0 16px;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
      }
      .slot-window {
        position: relative; height: 192px; overflow: hidden; border-radius: 14px;
        background: linear-gradient(#fef3c7, #fff 30%, #fff 70%, #fef3c7);
        border: 3px solid #b45309;
        box-shadow: inset 0 12px 18px rgba(0, 0, 0, 0.35), inset 0 -12px 18px rgba(0, 0, 0, 0.35);
        transition: box-shadow 0.4s ease-out;
      }
      .slot-machine.is-landed .slot-window {
        box-shadow: inset 0 12px 18px rgba(0, 0, 0, 0.35), inset 0 -12px 18px rgba(0, 0, 0, 0.35), 0 0 28px #fbbf24;
      }
      .slot-strip { will-change: transform; }
      .slot-item {
        height: 64px; line-height: 64px; padding: 0 28px;
        font-size: 22px; font-weight: 800; color: #1f2937;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .slot-item.is-winner { color: #b45309; animation: slotWinner 0.6s ease-out; }
      @keyframes slotWinner {
        40% { transform: scale(1.18); }
      }
      .slot-payline {
        position: absolute; left: 0; right: 0; top: 64px; height: 64px; pointer-events: none;
        border-top: 2px solid rgba(220, 38, 38, 0.75);
        border-bottom: 2px solid rgba(220, 38, 38, 0.75);
      }
      .slot-payline::before,
      .slot-payline::after {
        content: ""; position: absolute; top: 50%; transform: translateY(-50%);
        border: 10px solid transparent;
      }
      .slot-payline::before { left: 0; border-left-color: #dc2626; }
      .slot-payline::after { right: 0; border-right-color: #dc2626; }
      .slot-result {
        min-height: 32px; margin-top: 14px;
        font-size: 20px; font-weight: 800; color: #fde68a;
      }
      .slot-result.is-error { font-size: 14px; color: #fca5a5; }
      .slot-close {
        margin-top: 10px; width: 100%; padding: 12px; border-radius: 12px;
        font-weight: 700; color: #451a03; background: linear-gradient(#fde68a, #f59e0b);
      }
      .slot-close:hover { filter: brightness(1.06); }
      @media (prefers-reduced-motion: reduce) {
        .slot-item.is-winner { animation: none; }
      }
    </style>

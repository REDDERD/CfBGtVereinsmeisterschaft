<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>Badminton Vereinsmeisterschaft</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    
    <!-- Toast & Modal Styles -->
    <style>
      /* Responsive Base Styles - Fix viewport issues */
      * {
        box-sizing: border-box;
      }
      
      html {
        overflow-x: hidden;
        width: 100%;
      }
      
      body {
        overflow-x: hidden;
        width: 100%;
        position: relative;
      }
      
      #app {
        overflow-x: hidden;
        width: 100%;
        max-width: 100vw;
      }
      
      /* Ensure all containers respect viewport width */
      .container {
        max-width: 100%;
        overflow-x: hidden;
      }
      
      /* Toast Notifications */
      .custom-toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        min-width: 300px;
        max-width: 90%;
        padding: 16px 20px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 9999;
        animation: slideDown 0.3s ease-out;
        font-family: system-ui, -apple-system, sans-serif;
      }
      
      .custom-toast.success {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: white;
      }
      
      .custom-toast.error {
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        color: white;
      }
      
      .custom-toast.warning {
        background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        color: white;
      }
      
      .custom-toast.info {
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: white;
      }
      
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translate(-50%, -20px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }
      
      @keyframes fadeOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      
      .toast-icon {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
      }
      
      .toast-content {
        flex: 1;
        font-weight: 500;
      }
      
      .toast-close {
        cursor: pointer;
        opacity: 0.8;
        transition: opacity 0.2s;
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
      
      .toast-close:hover {
        opacity: 1;
      }

      /* Hide scrollbar but keep scrolling */
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }

      /* Safe area for iOS notch/home indicator */
      .safe-area-bottom {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      /* Mobile-first: Ensure inputs are at least 16px to prevent iOS zoom */
      @media (max-width: 767px) {
        input, select, textarea {
          font-size: 16px !important;
        }

        /* Compact card padding on mobile */
        .mobile-compact {
          padding: 12px !important;
        }
      }

      /* Modal Dialog */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        padding: 16px;
        animation: fadeIn 0.2s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .modal-container {
        background: white;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 500px;
        width: 100%;
        animation: slideUp 0.3s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .modal-header {
        padding: 24px 24px 16px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .modal-icon {
        width: 48px;
        height: 48px;
      }

      .modal-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #1f2937;
      }

      .modal-body {
        padding: 0 24px 24px 24px;
      }

      .modal-message {
        color: #6b7280;
        line-height: 1.6;
        font-size: 1rem;
      }

      .modal-footer {
        padding: 16px 24px 24px 24px;
        display: flex;
        gap: 12px;
        justify-content: flex-end;
      }

      .modal-btn {
        padding: 10px 24px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
        font-size: 1rem;
      }

      .modal-btn-cancel {
        background: #f3f4f6;
        color: #374151;
      }

      .modal-btn-cancel:hover {
        background: #e5e7eb;
      }

      .modal-btn-confirm {
        background: #4f46e5;
        color: white;
      }

      .modal-btn-confirm:hover {
        background: #4338ca;
      }

      .modal-btn-confirm:focus {
        outline: 2px solid #4f46e5;
        outline-offset: 2px;
      }

      /* ====== Dark Mode ====== */
      .dark body,
      html.dark body {
        background: linear-gradient(to bottom right, #0f172a, #1e1b4b) !important;
      }

      /* Cards & containers */
      .dark .bg-white { background-color: #1e293b !important; }
      .dark .bg-gray-50 { background-color: #283548 !important; }
      .dark .bg-gray-100 { background-color: #1e293b !important; }
      .dark .bg-gray-200 { background-color: #334155 !important; }

      /* Text – gray scale */
      .dark .text-gray-800 { color: #f1f5f9 !important; }
      .dark .text-gray-700 { color: #e2e8f0 !important; }
      .dark .text-gray-600 { color: #cbd5e1 !important; }
      .dark .text-gray-500 { color: #b0b8c4 !important; }
      .dark .text-gray-400 { color: #94a3b8 !important; }
      .dark .text-gray-300 { color: #64748b !important; }

      /* Text – accent colors (brighter for dark backgrounds) */
      .dark .text-indigo-600 { color: #818cf8 !important; }
      .dark .text-indigo-700 { color: #a5b4fc !important; }
      .dark .text-blue-600 { color: #60a5fa !important; }
      .dark .text-blue-700 { color: #93c5fd !important; }
      .dark .text-blue-800 { color: #93c5fd !important; }
      .dark .text-green-600 { color: #4ade80 !important; }
      .dark .text-red-600 { color: #f87171 !important; }
      .dark .text-red-500 { color: #f87171 !important; }
      .dark .text-yellow-600 { color: #fbbf24 !important; }
      .dark .text-orange-800 { color: #fb923c !important; }
      .dark .text-yellow-800 { color: #fbbf24 !important; }

      /* Medal/rank circles: keep text dark on bright backgrounds */
      .dark .bg-yellow-400,
      .dark .bg-gray-300,
      .dark .bg-orange-300 { color: #1f2937 !important; }

      /* Announcement ping: keep white dots inside gradient banners */
      .dark .from-indigo-600 .bg-white { background-color: #ffffff !important; }

      /* Borders */
      .dark .border-gray-200 { border-color: #334155 !important; }
      .dark .border-gray-300 { border-color: #475569 !important; }
      .dark .border { border-color: #334155 !important; }

      /* Colored backgrounds (softened for dark, lightened for better contrast with text) */
      .dark .bg-blue-50 { background-color: #1e3a5f !important; }
      .dark .bg-blue-100 { background-color: #1e3a5f !important; }
      .dark .bg-green-50 { background-color: #14432a !important; }
      .dark .bg-indigo-50 { background-color: #272463 !important; }
      .dark .bg-indigo-100 { background-color: #312e81 !important; }
      .dark .bg-yellow-50 { background-color: #4a2c0a !important; }
      .dark .bg-yellow-100 { background-color: #4a2c0a !important; }
      .dark .bg-orange-50 { background-color: #4a1d0a !important; }
      .dark .bg-orange-100 { background-color: #4a1d0a !important; }
      .dark .bg-red-50 { background-color: #501414 !important; }
      .dark .bg-purple-50 { background-color: #3b1a7a !important; }

      /* Navigation */
      .dark .border-t { border-color: #334155 !important; }
      .dark nav.bg-white,
      .dark .bg-white.shadow-lg,
      .dark .bg-white.shadow-sm,
      .dark .bg-white.border-t { background-color: #1e293b !important; }

      /* Shadows */
      .dark .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4), 0 4px 6px -4px rgba(0,0,0,0.3) !important; }
      .dark .shadow-xl { box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5), 0 8px 10px -6px rgba(0,0,0,0.4) !important; }
      .dark .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6) !important; }
      .dark .shadow-sm { box-shadow: 0 1px 2px 0 rgba(0,0,0,0.3) !important; }

      /* Inputs & selects */
      .dark input,
      .dark select,
      .dark textarea {
        background-color: #0f172a !important;
        color: #e2e8f0 !important;
        border-color: #475569 !important;
      }
      .dark input::placeholder { color: #94a3b8 !important; }

      /* Hover states */
      .dark .hover\:bg-gray-50:hover { background-color: #334155 !important; }
      .dark .hover\:bg-gray-100:hover { background-color: #334155 !important; }
      .dark .hover\:bg-gray-300:hover { background-color: #475569 !important; }

      /* Modal */
      .dark .modal-container { background: #1e293b !important; }
      .dark .modal-title { color: #f1f5f9 !important; }
      .dark .modal-message { color: #cbd5e1 !important; }
      .dark .modal-btn-cancel { background: #334155 !important; color: #e2e8f0 !important; }
      .dark .modal-btn-cancel:hover { background: #475569 !important; }
      .dark .modal-overlay { background: rgba(0, 0, 0, 0.7) !important; }

      /* Toast */
      .dark .custom-toast { box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5) !important; }

      /* Gradient cards (pyramid etc.) */
      .dark .from-yellow-100 { --tw-gradient-from: #854d0e !important; }
      .dark .to-orange-100 { --tw-gradient-to: #9a3412 !important; }
      .dark .from-blue-100 { --tw-gradient-from: #1e3a5f !important; }
      .dark .to-blue-200 { --tw-gradient-to: #1e40af !important; }
      .dark .from-green-100 { --tw-gradient-from: #14532d !important; }
      .dark .to-green-200 { --tw-gradient-to: #166534 !important; }

      /* Colored borders on badges/tags */
      .dark .text-indigo-400 { color: #a5b4fc !important; }
      .dark .border-yellow-300 { border-color: #a16207 !important; }
      .dark .border-orange-300 { border-color: #c2410c !important; }
      .dark .border-orange-400 { border-color: #c2410c !important; }
      .dark .border-yellow-400 { border-color: #a16207 !important; }
      .dark .border-indigo-300 { border-color: #6366f1 !important; }
      .dark .border-blue-300 { border-color: #3b82f6 !important; }
      .dark .border-blue-200 { border-color: #2563eb !important; }
      .dark .border-blue-400 { border-color: #3b82f6 !important; }

      /* Hover states for accent colors */
      .dark .hover\:text-indigo-800:hover { color: #c7d2fe !important; }
      .dark .hover\:text-gray-600:hover { color: #cbd5e1 !important; }
      .dark .hover\:text-gray-700:hover { color: #e2e8f0 !important; }
      .dark .hover\:bg-blue-50:hover { background-color: #1e3a5f !important; }
      .dark .hover\:bg-red-50:hover { background-color: #501414 !important; }
      .dark .hover\:bg-indigo-50:hover { background-color: #272463 !important; }

      /* Active page highlights */
      .dark .bg-indigo-600 { background-color: #4f46e5 !important; }

      /* Announcement banner stays as-is (already colored) */

      /* Scrollbar in dark mode */
      .dark ::-webkit-scrollbar { background: #1e293b; }
      .dark ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

      /* Dark mode transition */
      body, .bg-white, nav {
        transition: background-color 0.3s ease, color 0.2s ease;
      }
    </style>

  </head>

# .github/workflows/backup.yml
name: Firestore Backup

on:
  schedule:
    - cron: '0 3 * * *'  # täglich 03:00 Uhr
  workflow_dispatch:       # auch manuell auslösbar

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: backups  # separater Branch nur für Backups

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install xlsx node-fetch

      - name: Backup erstellen
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node backup.js

      - name: Committen
        run: |
          git config user.name "Backup Bot"
          git config user.email "bot@backup"
          git add .
          git commit -m "Backup $(date +%Y-%m-%d)" || echo "Keine Änderungen"
          git push

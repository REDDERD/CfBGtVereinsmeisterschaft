name: Daily Backup

on:
  schedule:
    - cron: '0 3 * * *'   # Täglich um 03:00 Uhr UTC
  workflow_dispatch:        # Manueller Start über GitHub-Oberfläche möglich

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository  (main)
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install dependecies
        run: npm install
        working-directory: scripts

      - name: Create backup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/backup.js

      - name: Push backup to backup branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Backup-Dateien in temporäres Verzeichnis sichern
          cp -r backup /tmp/backup_files

          # Backup-Branch auschecken oder neu erstellen
          git fetch origin
          if git ls-remote --exit-code --heads origin backup > /dev/null 2>&1; then
            git checkout backup
          else
            git checkout --orphan backup
            git rm -rf . --quiet
          fi

          # Backup-Ordner wiederherstellen und committen
          mkdir -p backup
          cp /tmp/backup_files/*.json backup/

          git add backup/
          git diff --staged --quiet || git commit -m "Datensicherung $(date +'%Y-%m-%d')"
          git push origin backup
